<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CagedSquirrel | Browser Shell</title>

<style>
:root {
  --bg: #0b1020;
  --panel: #151d32;
  --border: #293650;
  --accent: #38bdf8;
  --green: #22c55e;
  --red: #ef4444;
  --text: #e5edf8;
  --muted: #94a3b8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 30px 16px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 900px;
  margin: auto;
}

header {
  margin-bottom: 30px;
}

h1 { margin-bottom: 5px; }

h1 span { color: var(--accent); }

.subtitle { color: var(--muted); }

.panel {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 22px;
  margin-bottom: 18px;
}

label {
  display: block;
  margin: 12px 0 6px;
  color: var(--muted);
  font-size: 13px;
}

input, textarea {
  width: 100%;
  padding: 12px;
  background: #080e1b;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: white;
  font-family: monospace;
}

textarea {
  min-height: 90px;
  resize: vertical;
}

button {
  padding: 11px 18px;
  margin: 12px 8px 0 0;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}

.connect { background: var(--accent); color: #06111d; }
.disconnect { background: #475569; color: white; }
.send { background: var(--green); color: #07130b; }

.status {
  display: flex;
  align-items: center;
  gap: 10px;
}

.dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #64748b;
}

.dot.connected { background: var(--green); }
.dot.error { background: var(--red); }

#log {
  background: #080e1b;
  padding: 14px;
  border-radius: 6px;
  min-height: 150px;
  max-height: 300px;
  overflow-y: auto;
  font: 12px/1.7 monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.muted { color: var(--muted); }
footer { text-align: center; color: var(--muted); margin-top: 30px; }
</style>
</head>

<body>
<div class="container">

<header>
  <h1><span>CagedSquirrel</span> / Browser Shell</h1>
  <div class="subtitle">
    Remote Browser Connectivity & Control Interface
  </div>
</header>

<section class="panel">
  <h3>Connection</h3>

  <div class="status">
    <div id="dot" class="dot"></div>
    <strong id="status">Disconnected</strong>
  </div>

  <label>WebSocket Endpoint</label>
  <input id="endpoint"
    type="url"
    placeholder="wss://your-secure-tunnel.example.com/ws">

  <label>Authentication Token</label>
  <input id="token" type="password"
    placeholder="Enter access token">

  <button class="connect" onclick="connect()">Connect</button>
  <button class="disconnect" onclick="disconnect()">Disconnect</button>
</section>

<section class="panel">
  <h3>Command Console</h3>

  <label>JSON Command</label>
  <textarea id="command">{"type":"ping"}</textarea>

  <button class="send" onclick="sendCommand()">Send Command</button>
</section>

<section class="panel">
  <h3>Communication Log</h3>
  <div id="log">Browser Shell initialized.
Waiting for connection...</div>
</section>

<footer>
  CagedSquirrel &copy; 2026 |
  Browser Shell Prototype
</footer>

</div>

<script>
let socket = null;

const $ = id => document.getElementById(id);

function log(message) {
  const time = new Date().toLocaleTimeString();
  $("log").textContent += `\n[${time}] ${message}`;
  $("log").scrollTop = $("log").scrollHeight;
}

function setStatus(state, type = "") {
  $("status").textContent = state;
  $("dot").className = "dot " + type;
}

function connect() {
  const endpoint = $("endpoint").value.trim();
  const token = $("token").value.trim();

  if (!endpoint) {
    alert("Enter your WebSocket endpoint.");
    return;
  }

  if (socket) disconnect();

  let url;
  try {
    url = new URL(endpoint);
    if (!["ws:", "wss:"].includes(url.protocol)) {
      throw new Error("Use a ws:// or wss:// endpoint.");
    }
    if (url.username || url.password) {
      throw new Error("Credentials must not be embedded in the URL.");
    }
    if (url.protocol === "ws:" &&
        !["localhost", "127.0.0.1", "::1"].includes(url.hostname)) {
      throw new Error("Use WSS for remote connections.");
    }
  } catch (error) {
    log("Invalid endpoint: " + error.message);
    return;
  }

  // This query parameter must match the server's
  // authentication implementation.
  if (token) url.searchParams.set("token", token);

  setStatus("Connecting...");
  log("Connecting to " + url.origin + url.pathname);

  try {
    socket = new WebSocket(url.toString());

    socket.onopen = () => {
      setStatus("Connected", "connected");
      log("WebSocket connection established.");
    };

    socket.onmessage = event => {
      log("RECEIVED: " + event.data);
    };

    socket.onerror = () => {
      log("WebSocket error. Check endpoint, TLS and server logs.");
      setStatus("Connection Error", "error");
    };

    socket.onclose = event => {
      log(`Connection closed. Code: ${event.code}`);
      setStatus("Disconnected");
      socket = null;
    };

  } catch (error) {
    log("Connection failed: " + error.message);
    setStatus("Connection Failed", "error");
  }
}

function disconnect() {
  if (socket) {
    socket.close();
    socket = null;
  }
  setStatus("Disconnected");
  log("Disconnected.");
}

function sendCommand() {
  if (!socket || socket.readyState !== WebSocket.OPEN) {
    log("ERROR: No active connection.");
    return;
  }

  try {
    const payload = JSON.parse($("command").value);
    socket.send(JSON.stringify(payload));
    log("SENT: " + JSON.stringify(payload));
  } catch (error) {
    log("Invalid JSON: " + error.message);
  }
}
</script>

</body>
</html>
