<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CagedSquirrel Connection</title>
<link rel="stylesheet" href="style.css">
<script src="auth.js"></script>
<script>csRequireToken();</script>
<style>.hidden { display: none; }</style>
</head>
<body>
<div class="container">

<header>
  <h1><a href="home.html" style="text-decoration:none"><span>CagedSquirrel</span></a> / Connection</h1>
  <div class="subtitle">The Meta-System prototype on dot113</div>
</header>

<section class="panel">
  <h2>Meta-System</h2>
  <div class="status" style="margin-top:0">
    <div id="dot" class="dot"></div>
    <strong id="status">Finding the prototype...</strong>
  </div>
  <p class="muted" id="detail"></p>

  <div id="tokenBox" class="hidden">
    <label for="msToken">Meta-System token</label>
    <input id="msToken" type="password" placeholder="Paste once; saved in this browser" autocomplete="off">
  </div>

  <button class="send" id="open">Open Meta-System</button>
  <button class="connect" id="test">Test connection</button>
  <button class="secondary" id="refresh">Look up again</button>
</section>

<section class="panel">
  <h2>For ChatGPT</h2>
  <p class="muted">
    Paste this into a ChatGPT conversation so it knows how to reach the
    prototype. It includes the Meta-System token.
  </p>
  <textarea id="brief" readonly></textarea>
  <button class="connect" id="copy">Copy for ChatGPT</button>
  <span class="muted" id="copied"></span>
</section>

<footer><a href="home.html">Home</a></footer>

</div>

<script>
const $ = id => document.getElementById(id);
const ghToken = csGetToken();
const LOCAL = "cagedsquirrel.connection";   // Meta-System token typed by hand
let base = "";
let msToken = "";

function setStatus(text, kind, detail) {
  $("status").textContent = text;
  $("dot").className = "dot " + (kind || "");
  $("detail").textContent = detail || "";
}

function savedMsToken() {
  try { return (JSON.parse(localStorage.getItem(LOCAL) || "{}").token) || ""; } catch (e) { return ""; }
}

function currentMsToken() {
  const typed = $("msToken").value.trim();
  if (typed) {
    try { localStorage.setItem(LOCAL, JSON.stringify({ token: typed })); } catch (e) { /* ignore */ }
  }
  return msToken || typed;
}

async function lookUp() {
  setStatus("Finding the prototype...");
  try {
    const info = await csTunnelInfo(ghToken);
    if (!info.url) { setStatus("No address published yet.", "error"); return; }
    base = info.url.replace(/\/+$/, "");
    msToken = info.token || "";
    $("tokenBox").classList.toggle("hidden", !!msToken);
    if (!msToken) $("msToken").value = savedMsToken();
    setStatus("Found: " + base, "ok",
      "Published by dot113 " + new Date(info.updated).toLocaleString() + "." +
      (msToken ? "" : " The Meta-System token isn't published, so enter it once below."));
    renderBrief();
  } catch (e) {
    setStatus("Couldn't find the prototype.", "error", e.message);
  }
}

async function test() {
  const t = currentMsToken();
  if (!base) { setStatus("No address yet.", "error", "Use Look up again."); return; }
  if (!t) { setStatus("The Meta-System token is needed.", "error", "Paste it in the field above."); return; }
  setStatus("Testing " + base + "...");
  try {
    const res = await fetch(base + "/api/version?token=" + encodeURIComponent(t), { cache: "no-store" });
    if (res.status === 403) { setStatus("Meta-System refused the token.", "error"); return; }
    if (!res.ok) { setStatus("Meta-System answered " + res.status + ".", "error"); return; }
    const v = await res.json();
    setStatus("Connected: " + (v.label || "Meta-System"), "ok", base);
  } catch (e) {
    setStatus("No answer from the prototype.", "error",
      "The tunnel may have just restarted with a new address. Wait a minute, then Look up again.");
  }
}

function openMs() {
  const t = currentMsToken();
  if (!base) { setStatus("No address yet.", "error", "Use Look up again."); return; }
  if (!t) { setStatus("The Meta-System token is needed.", "error", "Paste it in the field above."); return; }
  window.open(base + "/?token=" + encodeURIComponent(t), "_blank", "noopener");
}

function renderBrief() {
  const t = msToken || $("msToken").value.trim();
  if (!base || !t) { $("brief").value = "Available once the address and Meta-System token are known."; return; }
  const q = "?token=" + encodeURIComponent(t);
  $("brief").value = [
    "You have access to a Meta-System prototype (a browser-based workspace that runs Claude Code sessions).",
    "",
    "Full interface (open in a browser):",
    base + "/" + q,
    "",
    "Read-only JSON endpoints (plain GET):",
    base + "/api/version" + q,
    base + "/api/sessions" + q + "   (live sessions)",
    base + "/api/sessions/past" + q,
    base + "/api/sessions/<sessionId>" + q + "&full=1   (one transcript)",
    base + "/api/projects" + q,
    "",
    "For now, only view. Do not type into terminals or send messages unless asked."
  ].join("\n");
}

async function copyBrief() {
  renderBrief();
  try {
    await navigator.clipboard.writeText($("brief").value);
    $("copied").textContent = " Copied.";
  } catch (e) {
    $("brief").select();
    $("copied").textContent = " Copy was blocked; the text is selected, press Ctrl+C.";
  }
}

$("open").addEventListener("click", openMs);
$("test").addEventListener("click", test);
$("refresh").addEventListener("click", lookUp);
$("copy").addEventListener("click", copyBrief);
$("msToken").addEventListener("input", renderBrief);
if (ghToken) lookUp();
</script>
</body>
</html>
